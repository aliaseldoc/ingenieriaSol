name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STAFF_EMAIL_DOMAIN: ${{ secrets.VITE_STAFF_EMAIL_DOMAIN }}
          # Modulo de fichaje en funcionamiento desde el 15/10/2026 (ver
          # src/lib/featureFlags.js). En false vuelve a ocultarse.
          VITE_FICHAJE_HABILITADO: 'true'
      # GitHub Pages no soporta ruteo del lado del cliente: si alguien entra
      # directo a una sub-ruta (o refresca la pagina) devuelve 404. Servir el
      # mismo index.html como 404.html es el truco estandar para que React
      # Router tome el control igual.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
